<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#030303" />
    <title>Reset password — Innov8 Studios Dashboard</title>
    <link rel="preload" href="../fonts/Comfortaa-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/CenturyGothicPaneuropeanRegular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="../dashboard.css" />
    <style>
      .auth-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .auth-card {
        width: 100%;
        max-width: 23rem;
        padding: 2.25rem 2rem;
      }
      .auth-brand {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        margin-bottom: 1.75rem;
      }
      .auth-brand img { height: 1.75rem; }
      .auth-card h1 {
        font-family: var(--font-display);
        font-size: 1.375rem;
        margin: 0 0 0.375rem;
      }
      .auth-card p.sub { color: var(--muted); font-size: 0.875rem; margin: 0 0 1.5rem; }
      .auth-card form { display: flex; flex-direction: column; gap: 1rem; }
      .auth-card .btn-primary { width: 100%; justify-content: center; }
      .auth-note {
        font-size: 0.75rem;
        color: var(--faint);
        margin-top: 1rem;
        line-height: 1.5;
      }
      .auth-note a { color: var(--orange-bright); }
      .auth-error {
        display: none;
        font-size: 0.8125rem;
        color: var(--danger);
        background: rgba(255, 90, 95, 0.1);
        border: 0.0625rem solid rgba(255, 90, 95, 0.3);
        border-radius: var(--radius-sm);
        padding: 0.625rem 0.75rem;
        margin-bottom: 1rem;
      }
      .auth-error.is-visible { display: block; }

      /* Password visibility toggle */
      .input-group { position: relative; }
      .input-group .input { padding-right: 2.75rem; }
      .input-toggle {
        position: absolute;
        top: 50%;
        right: 0.25rem;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.25rem;
        height: 2.25rem;
        border: none;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
      }
      .input-toggle:hover { color: var(--orange-bright); background: rgba(255, 106, 26, 0.12); }
      .input-toggle svg { width: 1.125rem; height: 1.125rem; }
    </style>
  </head>
  <body>
    <div class="dash-ambient" aria-hidden="true"></div>
    <div class="auth-shell">
      <div class="panel glass-surface auth-card">
        <div class="auth-brand">
          <img src="../assets/images/logo%20white.png" alt="Innov8 Studios" />
        </div>

        <div data-state-loading>
          <h1>Checking your link…</h1>
          <p class="sub">Hold on a moment.</p>
        </div>

        <div data-state-form style="display:none;">
          <h1>Set a new password</h1>
          <p class="sub">Choose a new password for your account.</p>

          <p class="auth-error" data-reset-error></p>

          <form data-reset-form>
            <div class="field">
              <label class="field-label" for="new-password">New password</label>
              <div class="input-group">
                <input class="input" id="new-password" name="password" type="password" autocomplete="new-password" required minlength="6" />
                <button type="button" class="input-toggle" data-toggle-password aria-label="Show password" aria-pressed="false">
                  <svg data-icon-eye viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg data-icon-eye-off viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M2 12s3.5-7 10-7c1.6 0 3 .3 4.2.9M22 12s-3.5 7-10 7c-1.6 0-3-.3-4.2-.9"/><path d="M4 4l16 16"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="confirm-password">Confirm password</label>
              <div class="input-group">
                <input class="input" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="6" />
                <button type="button" class="input-toggle" data-toggle-password aria-label="Show password" aria-pressed="false">
                  <svg data-icon-eye viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg data-icon-eye-off viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M2 12s3.5-7 10-7c1.6 0 3 .3 4.2.9M22 12s-3.5 7-10 7c-1.6 0-3-.3-4.2-.9"/><path d="M4 4l16 16"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <button class="btn btn-primary" type="submit" data-reset-submit>Update password</button>
          </form>
        </div>

        <div data-state-invalid style="display:none;">
          <h1>Link expired</h1>
          <p class="sub">This password reset link is invalid or has expired.</p>
          <p class="auth-note"><a href="login.html">Request a new one from the sign-in page.</a></p>
        </div>

        <div data-state-success style="display:none;">
          <h1>Password updated</h1>
          <p class="sub">Your password has been changed. Redirecting you to sign in…</p>
        </div>
      </div>
    </div>

    <script src="js/env.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
